name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -e .[dev]
    - name: Ruff Check
      run: ruff check .
    - name: Mypy Check
      run: mypy src/ tests/ --explicit-package-bases
