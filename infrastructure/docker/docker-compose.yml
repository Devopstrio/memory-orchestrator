version: '3.8'
services:
  api:
    build: ../../
    ports:
      - "8080:8080"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  pgvector:
    image: ankane/pgvector
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
  neo4j:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
