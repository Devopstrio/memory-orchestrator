openapi: 3.0.3
info:
  title: Memory Orchestrator API
  version: 1.0.0
paths:
  /v1/memory/store:
    post:
      summary: Store a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Memory Stored
  /v1/memory/retrieve:
    get:
      summary: Retrieve context
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Memory Context
